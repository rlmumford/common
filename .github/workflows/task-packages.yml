name: Task packages

on:
  pull_request:
    branches: [2.x]
  push:
    branches: [2.x]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: task_consumer
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Build an independent Drupal 10 consumer
        run: |
          composer create-project drupal/recommended-project:^10 /tmp/task-consumer --no-interaction
          cd /tmp/task-consumer
          composer config minimum-stability dev
          composer config repositories.typed-data-plus vcs https://git.drupalcode.org/project/typed_data_plus.git
          composer config repositories.common-data path "$GITHUB_WORKSPACE/modules/data/*"
          composer config repositories.common-util path "$GITHUB_WORKSPACE/modules/util/*"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('composer.json')
          data = json.loads(path.read_text())
          names = ['task', 'checklist', 'service', 'plugin_reference', 'note']
          repos = data['repositories']
          for repo in repos.values() if isinstance(repos, dict) else repos:
              if repo['type'] == 'path':
                  versions = {'rlmumford/' + n: '2.x-dev' for n in names}
                  repo['options'] = {'versions': versions}
          path.write_text(json.dumps(data, indent=2))
          PY
          composer require rlmumford/task:2.x-dev rlmumford/service:2.x-dev rlmumford/note:2.x-dev drupal/core-dev:^10 --with-all-dependencies --no-interaction
      - name: Test the installed task packages
        working-directory: /tmp/task-consumer
        env:
          SIMPLETEST_DB: ${{ matrix.database == 'mysql' && 'mysql://root:testing@127.0.0.1:3306/task_consumer' || 'sqlite://localhost/:memory:' }}
          SYMFONY_DEPRECATIONS_HELPER: weak
        run: vendor/bin/phpunit --bootstrap /tmp/task-consumer/web/core/tests/bootstrap.php web/modules/contrib/task/tests/src/Kernel
      - name: Test the service module
        working-directory: /tmp/task-consumer
        env:
          SIMPLETEST_DB: ${{ matrix.database == 'mysql' && 'mysql://root:testing@127.0.0.1:3306/task_consumer' || 'sqlite://localhost/:memory:' }}
          SYMFONY_DEPRECATIONS_HELPER: weak
        run: vendor/bin/phpunit --bootstrap /tmp/task-consumer/web/core/tests/bootstrap.php web/modules/contrib/service/tests/src/Kernel
      - name: Test the checklist module
        working-directory: /tmp/task-consumer
        env:
          SIMPLETEST_DB: ${{ matrix.database == 'mysql' && 'mysql://root:testing@127.0.0.1:3306/task_consumer' || 'sqlite://localhost/:memory:' }}
          SYMFONY_DEPRECATIONS_HELPER: weak
        run: vendor/bin/phpunit --bootstrap /tmp/task-consumer/web/core/tests/bootstrap.php web/modules/contrib/checklist/tests/src/Kernel
