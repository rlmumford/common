services:
  typed_data_plus.data_fetcher:
    class: Drupal\typed_data_plus\DataFetcher
    arguments: ['@plugin.manager.typed_data_filter', '@typed_data_manager']
  typed_data_plus.placeholder_resolver:
    class: Drupal\typed_data_plus\PlaceholderResolver
    arguments: ['@typed_data_plus.data_fetcher', '@plugin.manager.typed_data_filter']
  typed_data_plus.condition_parser:
    class: Drupal\typed_data_plus\Condition\ConditionParser
  typed_data_plus.condition_evaluator:
    class: Drupal\typed_data_plus\Condition\ConditionEvaluator
    arguments: ['@typed_data_plus.condition_parser', '@typed_data_plus.data_fetcher']
  typed_data_plus.context_handler:
    class: Drupal\typed_data_plus\Plugin\Context\ContextHandler
    arguments: ['@typed_data_plus.data_fetcher', '@context.repository']
