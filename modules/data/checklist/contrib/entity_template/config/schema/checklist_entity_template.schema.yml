checklist_item_handler.entity_template__create:
  type: checklist_item_handler
  label: Create an entity from a template
  mapping:
    templates:
      type: sequence
      label: Template alternatives keyed by machine name
      sequence:
        type: checklist_entity_template.candidate

checklist_entity_template.candidate:
  type: mapping
  mapping:
    template:
      type: entity_template.source
      label: Template source
    condition:
      type: condition.plugin.[id]
      label: Candidate availability condition
    context_mapping:
      type: sequence
      label: This template's input mappings
      sequence:
        type: string
    editor:
      type: checklist_entity_template.editor
      label: Optional prepared entity editor

checklist_entity_template.editor:
  type: mapping
  mapping:
    type:
      type: string
      constraints:
        Choice: [referenced, embedded]
    configuration:
      type: checklist_entity_template.editor.[%parent.type]

checklist_entity_template.editor.referenced:
  type: mapping
  mapping:
    form_id:
      type: string
      label: Reusable Flexiform ID

checklist_entity_template.editor.embedded:
  type: mapping
  mapping:
    plugin:
      type: string
      label: Form plugin
    configuration:
      type: flexiform.form_plugin.[%parent.plugin]
