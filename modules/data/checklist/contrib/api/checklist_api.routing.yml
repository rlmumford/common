checklist.item.state:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/{item_name}'
  defaults:
    _controller: '\Drupal\checklist_api\Controller\ChecklistApiController::itemState'
  options:
    no_cache: 'TRUE'
  methods: ['GET', 'HEAD']
  requirements:
    _format: 'json'
checklist.item.operations:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/{item_name}/operations'
  defaults:
    _controller: '\Drupal\checklist_api\Controller\ChecklistApiController::operations'
  options:
    no_cache: 'TRUE'
  methods: ['GET', 'HEAD']
  requirements:
    _format: 'json'
checklist.item.operation:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/{item_name}/operation'
  defaults:
    _controller: '\Drupal\checklist_api\Controller\ChecklistApiController::execute'
  options:
    no_cache: 'TRUE'
  methods: ['POST']
  requirements:
    _format: 'json'
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'

checklist.workspace.acquire:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/workspace'
  defaults:
    _controller: '\Drupal\checklist_api\Controller\ChecklistApiController::acquireWorkspace'
  options:
    no_cache: 'TRUE'
  methods: ['POST']
  requirements:
    _format: 'json'
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'

checklist.workspace.renew:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/workspace'
  defaults:
    _controller: '\Drupal\checklist_api\Controller\ChecklistApiController::renewWorkspace'
  options:
    no_cache: 'TRUE'
  methods: ['PATCH']
  requirements:
    _format: 'json'
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'

checklist.workspace.release:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/workspace'
  defaults:
    _controller: '\Drupal\checklist_api\Controller\ChecklistApiController::releaseWorkspace'
  options:
    no_cache: 'TRUE'
  methods: ['DELETE']
  requirements:
    _format: 'json'
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'
