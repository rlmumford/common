checklist.item.action_form:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/{item_name}/action'
  defaults:
    _controller: '\Drupal\checklist\Controller\ChecklistController::actionForm'
    _title: 'Action'
  requirements:
    _custom_access: '\Drupal\checklist\Controller\ChecklistController::actionFormAccess'
  options:
    parameters:
      checklist:
        checklist_tempstore: TRUE
checklist.item.row_form:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/{item_name}/row'
  defaults:
    _controller: '\Drupal\checklist\Controller\ChecklistController::rowForm'
    _title: 'Row'
  requirements:
    _custom_access: '\Drupal\checklist\Controller\ChecklistController::rowFormAccess'
  options:
    parameters:
      checklist:
        checklist_tempstore: TRUE

checklist.refresh:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/refresh/{instance_uuid}'
  defaults:
    _controller: '\Drupal\checklist\Controller\ChecklistRefreshController::refresh'
  methods: [GET]
  requirements:
    # The controller authorizes the fresh host and field through the resolver.
    _access: 'TRUE'

checklist.item.history_page:
  path: '/checklist/{entity_type}/{entity_id}/{checklist}/{item_name}/history/view'
  defaults:
    _controller: '\Drupal\checklist\Controller\ChecklistHistoryController::view'
    _title: 'Checklist item history'
  methods: [GET, POST]
  requirements:
    # The reader checks host, field and item access before returning history.
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'
    _admin_route: TRUE

checklist.item.retry:
  path: '/checklist/item/{item_uuid}/attempt/{attempt_id}/retry'
  defaults:
    _controller: '\Drupal\checklist\Controller\ChecklistRetryController::view'
    _title: 'Retry checklist item'
  requirements:
    # The form authorizes the fresh binding before looking up the attempt.
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'
    _admin_route: TRUE
