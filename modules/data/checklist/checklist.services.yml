services:
  plugin.manager.checklist_type:
    class: Drupal\checklist\ChecklistTypeManager
    parent: default_plugin_manager
  plugin.manager.checklist_item_handler:
    class: Drupal\checklist\ChecklistItemHandlerManager
    parent: default_plugin_manager
  checklist.context_collector:
    class: Drupal\checklist\ChecklistContextCollector
    arguments: ['@event_dispatcher']
  checklist.context_collector_subscriber:
    class: Drupal\checklist\EventSubscriber\ChecklistContextsEventSubscriber
    tags:
      - { name: event_subscriber }
  checklist.tempstore_repository:
    class: Drupal\checklist\ChecklistTempstoreRepository
    arguments: ['@tempstore.shared']
  checklist.tempstore_param_converter:
    class: Drupal\checklist\ChecklistTempstoreParamConverter
    arguments: ['@checklist.tempstore_repository', '@entity_type.manager']
    tags:
      - { name: paramconverter, priority: 10 }
  checklist.context_preparer:
    class: Drupal\checklist\ChecklistContextPreparer
    arguments: ['@checklist.context_collector', '@typed_data_plus.context_handler']
  checklist.condition_evaluator:
    class: Drupal\checklist\ChecklistConditionEvaluator
    arguments: ['@plugin.manager.condition', '@checklist.context_collector', '@typed_data_plus.context_handler']
  checklist.action_operation_dispatcher:
    class: Drupal\checklist\ChecklistActionOperationDispatcher
    arguments: ['@checklist.context_preparer']
  checklist.resolver:
    class: Drupal\checklist\ChecklistResolver
    arguments: ['@current_user']
  checklist.item_reader:
    class: Drupal\checklist\ChecklistItemReader
    arguments: ['@checklist.resolver', '@checklist.context_preparer']
  checklist.attempt_journal:
    class: Drupal\checklist\Attempt\ChecklistAttemptJournal
    arguments: ['@database', '@uuid', '@datetime.time']
  checklist.attempt_claims:
    class: Drupal\checklist\Attempt\ChecklistAttemptClaims
    arguments: ['@database', '@checklist.attempt_journal', '@uuid', '@datetime.time']
  checklist.iteration_runner:
    class: Drupal\checklist\Execution\ChecklistIterationRunner
    arguments: ['@entity_type.manager', '@account_switcher', '@checklist.resolver', '@checklist.context_preparer', '@checklist.attempt_journal', '@checklist.attempt_claims']
  checklist.iteration_scheduler:
    class: Drupal\checklist\Execution\ChecklistIterationScheduler
    arguments: ['@database', '@datetime.time', '@queue', '@logger.channel.checklist']
  logger.channel.checklist:
    parent: logger.channel_base
    arguments: ['checklist']
